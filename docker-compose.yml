services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-onineme}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-onineme}
      POSTGRES_DB: ${DB_NAME:-onineme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-onineme}
      DB_PASSWORD: ${DB_PASSWORD:-onineme}
      DB_NAME: ${DB_NAME:-onineme}
      MONGO_URL: mongodb://mongo:27017
      MONGO_NAME: ${MONGO_NAME:-onineme}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  pg_data:
  mongo_data:
